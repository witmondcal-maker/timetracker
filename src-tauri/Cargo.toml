[package]
name = "rastreador"
version = "0.1.0"
description = "Rastreador local de tempo para anotação de vídeo"
edition = "2021"

[lib]
name = "rastreador_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-sql = { version = "2", features = ["sqlite"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
